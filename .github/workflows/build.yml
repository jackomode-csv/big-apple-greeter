# Rebuild the block-rendered pages and publish the site.
#
# The generated HTML is committed to the repo as well, so the site still works
# if you just open the files. This workflow re-renders from content/ on every
# push, so an edit made through admin/ (which commits JSON, not HTML) turns
# into a live page without anyone running anything locally.
#
# NOT ENABLED YET. Two things have to be true first:
#
#   1. GitHub Pages has to be switched on for this repo, with the source set
#      to "GitHub Actions" in Settings > Pages.
#
#   2. The video has to move. assets/*.mp4 is gitignored - 206 MB across 13
#      clips - so a Pages deploy right now would ship a site whose reels are
#      all 404. Those files belong on Cloudflare R2, the way the portfolio
#      serves its reels, and the 42 path references need rewriting to point
#      at them.
#
# Until then this file is documentation of the intended pipeline.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render every page that has content
        run: |
          for f in content/*.json; do
            page=$(basename "$f" .json)
            python tools-render.py "$page"
          done

      - name: Fail if a rendered page drifted from what is committed
        # The committed HTML and the rendered HTML must agree. If they do not,
        # someone hand-edited a generated file and their change is about to be
        # silently thrown away - better to stop and say so.
        run: |
          if ! git diff --quiet; then
            echo "Rendered output differs from the committed HTML:"
            git diff --stat
            echo
            echo "Edit content/*.json and re-run tools-render.py; do not edit"
            echo "the generated .html files by hand."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
